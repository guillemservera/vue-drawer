name: Bug report
description: Report a reproducible VueDrawer problem
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Package version
      description: Which @guillemservera/vue-drawer version is affected?
      placeholder: "0.1.1"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal reproduction or a link to one.
      placeholder: Include the smallest code or repository that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Vue, Node.js, browser, OS, direction, modal state and snap points.
    validations:
      required: true
