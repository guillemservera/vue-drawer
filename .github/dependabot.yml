version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine updates; majors stay separate so each gets its own review.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types track the oldest supported Node (CI: 22), not the newest release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
