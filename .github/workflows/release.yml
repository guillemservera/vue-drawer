name: Release

# Stages an npm release when a GitHub release is published (tag vX.Y.Z matching package.json).
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN. The trusted publisher only allows
# `npm stage publish`: the version goes live after a maintainer approves it with 2FA
# (npmjs.com → package → Staged, or `npm stage approve <id>`), so CI alone can never ship.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  # Per tag: a shared group would cancel a still-pending run when another release is published.
  group: vue-drawer-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
      # `npm stage` ships with npm 12 (Node 24 bundles npm 11).
      - run: npm install -g npm@12
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      # prepublishOnly re-runs typecheck/test/build/publint; provenance links the tarball to this run.
      # GitHub prereleases go to the `next` dist-tag so ordinary installs keep resolving `latest`.
      - name: Stage publish
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm stage publish --provenance --access public --tag "$DIST_TAG"
